<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA — интернет-магазин</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">

      <a href="#" class="logo">
        NOVA<span>.</span>
      </a>

      <div class="search">
        <input
          id="searchInput"
          type="text"
          placeholder="Поиск товаров..."
        >
        <span>⌕</span>
      </div>

      <div class="header-actions">

        <button class="header-btn">
          ♡ <span>Избранное</span>
        </button>

        <button
          class="header-btn cart-btn"
          onclick="openCart()"
        >
          🛒 <span>Корзина</span>

          <b id="cartCount">0</b>
        </button>

      </div>

    </div>
  </header>


  <main>

    <!-- HERO -->
    <section class="hero">

      <div class="hero-content">

        <div class="hero-label">
          NOVA MARKET
        </div>

        <h1>
          Всё нужное.<br>
          В одном месте.
        </h1>

        <p>
          Техника, одежда, товары для дома
          и многое другое по отличным ценам.
        </p>

        <button
          class="hero-button"
          onclick="scrollToProducts()"
        >
          Смотреть товары →
        </button>

      </div>

      <div class="hero-decoration"></div>

    </section>


    <!-- CATEGORIES -->
    <section class="section">

      <div class="section-header">
        <h2>Категории</h2>
      </div>

      <div class="categories">

        <button
          class="category"
          onclick="filterCategory('Электроника')"
        >
          <div class="category-icon purple">
            📱
          </div>

          <span>Электроника</span>
        </button>


        <button
          class="category"
          onclick="filterCategory('Одежда')"
        >
          <div class="category-icon orange">
            👕
          </div>

          <span>Одежда</span>
        </button>


        <button
          class="category"
          onclick="filterCategory('Дом')"
        >
          <div class="category-icon green">
            🏠
          </div>

          <span>Для дома</span>
        </button>


        <button
          class="category"
          onclick="filterCategory('Красота')"
        >
          <div class="category-icon blue">
            ✨
          </div>

          <span>Красота</span>
        </button>


        <button
          class="category"
          onclick="filterCategory('Спорт')"
        >
          <div class="category-icon pink">
            🏃
          </div>

          <span>Спорт</span>
        </button>


        <button
          class="category"
          onclick="filterCategory('Другое')"
        >
          <div class="category-icon yellow">
            🎁
          </div>

          <span>Другое</span>
        </button>

      </div>

    </section>


    <!-- PRODUCTS -->
    <section
      class="section"
      id="productsSection"
    >

      <div class="section-header">

        <h2 id="productsTitle">
          Популярные товары
        </h2>

      </div>

      <div
        class="products"
        id="productList"
      ></div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer>

    <div class="footer-inner">

      <div class="footer-about">

        <div class="footer-logo">
          NOVA<span>.</span>
        </div>

        <p>
          Современный маркетплейс
          для удобных покупок.
        </p>

      </div>


      <div class="footer-column">

        <h4>Покупателям</h4>

        <a href="#">Доставка</a>
        <a href="#">Оплата</a>
        <a href="#">Возврат</a>

      </div>


      <div class="footer-column">

        <h4>Компания</h4>

        <a href="#">О нас</a>
        <a href="#">Контакты</a>
        <a href="#">Партнёрам</a>

      </div>

    </div>

  </footer>


  <!-- OVERLAY -->
  <div
    class="overlay"
    id="overlay"
    onclick="closeAll()"
  ></div>


  <!-- CART -->
  <aside
    class="cart"
    id="cart"
  >

    <div class="cart-header">

      <h2>Корзина</h2>

      <button
        class="close-button"
        onclick="closeCart()"
      >
        ×
      </button>

    </div>


    <div
      class="cart-items"
      id="cartItems"
    ></div>


    <div class="cart-footer">

      <div class="cart-total">

        <span>Итого</span>

        <strong id="totalPrice">
          0 сум
        </strong>

      </div>

      <button
        class="checkout-button"
        onclick="checkout()"
      >
        Перейти к оформлению
      </button>

    </div>

  </aside>


  <!-- PRODUCT MODAL -->
  <div
    class="product-modal"
    id="productModal"
  >

    <div class="product-modal-content">

      <div class="modal-image">
        <img
          id="modalImage"
          src=""
          alt=""
        >
      </div>


      <div class="modal-info">

        <button
          class="modal-close"
          onclick="closeModal()"
        >
          ×
        </button>

        <div
          class="rating"
          id="modalRating"
        ></div>

        <h2 id="modalName"></h2>

        <p
          id="modalDescription"
          class="modal-description"
        ></p>

        <div
          id="modalPrice"
          class="modal-price"
        ></div>

        <button
          id="modalBuy"
          class="modal-buy"
        >
          Добавить в корзину
        </button>

      </div>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
